# ==============================================================================
# deploy/nginx/apfrs.conf
# APFRS Nginx Production Reverse Proxy & Static SPA Configuration
#
# Installation:
#   sudo cp deploy/nginx/apfrs.conf /etc/nginx/sites-available/apfrs
#   sudo ln -s /etc/nginx/sites-available/apfrs /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Rate limiting zone for API endpoints
limit_req_zone $binary_remote_addr zone=apfrs_api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_EC2_PUBLIC_IP;

    # Root directory for production static SPA build
    root /var/www/apfrs/frontend/dist;
    index index.html;

    # Maximum payload size (for CSV/Excel attendance sheet imports)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Logging
    access_log /var/log/nginx/apfrs_access.log;
    error_log /var/log/nginx/apfrs_error.log warn;

    # Static Assets Caching (Vite content-hashed files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon and static icons
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # API Reverse Proxy -> Node.js Backend (:8001)
    location /api/ {
        limit_req zone=apfrs_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # WebSocket / Keep-Alive headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Real Client IP and Protocol forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long-running batch imports / report generations
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Frontend Single Page Application Routing
    # Fallback all non-file routes to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

